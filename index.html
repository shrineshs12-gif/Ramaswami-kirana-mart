<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramaswami Kirana Mart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #10b981;       /* Premium Fresh Green */
            --primary-dark: #059669;
            --secondary: #f59e0b;     /* Gold Accent */
            --dark: #0f172a;          /* Slate Dark */
            --light: #f8fafc;         /* Soft Background */
            --white: #ffffff;
            --gray-100: #f1f5f9;
            --gray-300: #cbd5e1;
            --gray-600: #475569;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            overflow-x: hidden;
        }

        /* --- Header Styles --- */
        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 15px 5%;
            position: sticky;
            top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
            z-index: 100;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .logo-container {
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .owner-name {
            font-size: 12px;
            font-weight: 500;
            color: var(--gray-600);
            margin-top: 2px;
        }

        .cart-icon {
            font-size: 15px;
            font-weight: 600;
            background: var(--dark);
            color: var(--white);
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }

        .cart-icon:hover {
            transform: translateY(-2px);
            background: var(--primary);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        /* --- Main Container --- */
        .container {
            max-width: 1300px;
            margin: 40px auto;
            padding: 0 5%;
        }

        /* --- Search Bar Styles --- */
        .search-container {
            display: flex;
            margin-bottom: 25px;
            gap: 12px;
            max-width: 550px;
            background: var(--white);
            padding: 6px;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-100);
            transition: var(--transition);
        }

        .search-container:focus-within {
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }

        .search-input {
            flex-grow: 1;
            padding: 10px 15px;
            font-size: 15px;
            border: none;
            outline: none;
            background: transparent;
        }

        .search-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .search-btn:hover {
            background-color: var(--primary-dark);
        }

        /* --- Category Tabs --- */
        .categories-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 30px;
            scrollbar-width: none; /* Firefox */
        }

        .categories-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .category-tab {
            background: var(--white);
            color: var(--gray-600);
            border: 1px solid var(--gray-300);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
        }

        .category-tab.active, .category-tab:hover {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        h2 {
            margin-bottom: 25px;
            color: var(--dark);
            font-weight: 700;
            font-size: 28px;
            position: relative;
            display: inline-block;
        }

        h2::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 40px;
            height: 4px;
            background: var(--secondary);
            border-radius: 2px;
        }

        /* --- Grid & Product Cards --- */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--white);
            padding: 24px;
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition);
            border: 1px solid rgba(0,0,0,0.02);
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-md);
            border-color: rgba(16, 185, 129, 0.2);
        }

        .product-name {
            font-size: 17px;
            font-weight: 600;
            margin: 10px 0 15px 0;
            color: var(--dark);
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .weight-custom-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 18px;
            background: var(--gray-100);
            padding: 6px 12px;
            border-radius: 12px;
        }

        .weight-input {
            width: 65px;
            padding: 6px;
            border: 1px solid var(--gray-300);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            text-align: center;
            font-weight: 600;
            background: var(--white);
        }

        .weight-unit-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--gray-600);
        }

        .product-price {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 18px;
        }

        .add-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 0;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .add-btn:hover {
            background-color: var(--primary-dark);
        }

        .add-btn:active {
            transform: scale(0.96);
        }

        /* --- Modern Cart Sidebar --- */
        .cart-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(4px);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }

        .cart-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .cart-sidebar {
            position: fixed;
            right: -450px;
            top: 0;
            width: 400px;
            height: 100%;
            background: var(--white);
            box-shadow: -10px 0 30px rgba(0,0,0,0.05);
            transition: cubic-bezier(0.4, 0, 0.2, 1) 0.35s;
            padding: 30px;
            display: flex;
            flex-direction: column;
            z-index: 101;
            border-top-left-radius: 24px;
            border-bottom-left-radius: 24px;
        }

        .cart-sidebar.active {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gray-100);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .cart-header h3 {
            font-size: 22px;
            font-weight: 700;
        }

        .close-cart {
            font-size: 28px;
            cursor: pointer;
            color: var(--gray-600);
            transition: var(--transition);
        }

        .close-cart:hover {
            color: var(--dark);
            transform: rotate(90deg);
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 5px;
        }

        .cart-items::-webkit-scrollbar {
            width: 5px;
        }
        .cart-items::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            background: var(--gray-100);
            padding: 12px 16px;
            border-radius: 12px;
        }

        .cart-item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-weight: 600;
        }

        .cart-item-qty {
            font-size: 12px;
            color: var(--gray-600);
        }

        .cart-item-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-item-price {
            font-weight: 700;
        }

        .remove-item-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 20px;
            cursor: pointer;
        }

        .clear-cart-btn {
            background: transparent;
            color: #ef4444;
            border: 1px solid #fee2e2;
            padding: 8px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            width: 100%;
        }

        .clear-cart-btn:hover {
            background-color: #fee2e2;
        }

        /* --- Form Input Styles --- */
        .customer-details-form {
            border-top: 1px solid var(--gray-100);
            padding-top: 15px;
            margin-bottom: 15px;
        }

        .customer-details-form h4 {
            margin-bottom: 10px;
            font-size: 15px;
            color: var(--dark);
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid var(--gray-300);
            border-radius: 10px;
            outline: none;
            background: var(--gray-100);
            transition: var(--transition);
        }

        .form-input:focus {
            border-color: var(--primary);
            background: var(--white);
        }

        textarea.form-input {
            resize: none;
            height: 60px;
        }

        .cart-total {
            font-size: 20px;
            font-weight: 700;
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            border-top: 1px dashed var(--gray-300);
            padding-top: 15px;
        }

        .error-box {
            background-color: #fef2f2;
            color: #ef4444;
            border: 1px solid #fca5a5;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .checkout-btn {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
        }

        .checkout-btn:hover {
            background-color: #128c7e;
            transform: translateY(-2px);
        }

        @media(max-width: 480px) {
            .cart-sidebar {
                width: 100%;
                right: -100%;
                border-radius: 0;
            }
        }
    </style>
</head>

            { id: 57, name: "टाईड सरफ (Tide Detergent)", baseWeight: 1, unit: "Pcs", basePrice: 10, category: "soaps" },
            { id: 58, name: "एरिअल सरफ (Ariel Detergent)", baseWeight: 1, unit: "Pcs", basePrice: 10, category: "soaps" },
            { id: 59, name: "लक्स साबण (Lux Soap)", baseWeight: 1, unit: "Pcs", basePrice: 10, category: "soaps" },
            { id: 60, name: "लाईफबॉय साबण (Lifebuoy Soap)", baseWeight: 1, unit: "Pcs", basePrice: 10, category: "soaps" },
            { id: 61, name: "रंगोळी (Rangoli Powder)", baseWeight: 1, unit: "Pcs", basePrice: 10, category: "personal-care" },
            { id: 62, name: "इनो (Eno)", baseWeight: 1, unit: "Pcs", basePrice: 10, category: "personal-care" },
            { id: 63, name: "माचीस चावी (Matchbox Chaavi)", baseWeight: 1, unit: "Pcs", basePrice: 10, category: "personal-care" },
            { id: 64, name: "cell घड्याळ (Clock Battery Cells)", baseWeight: 1, unit: "Pcs", basePrice: 20, category: "personal-care" },
            { id: 65, name: "सेल रिमोट (Remote Battery Cells)", baseWeight: 1, unit: "Pcs", basePrice: 20, category: "personal-care" }
        ];

        let cart = [];

        function loadProducts(productsToShow = products) {
            const container = document.getElementById('products-container');
            if (productsToShow.length === 0) {
                container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #888; font-weight:600; padding: 40px;'>No products found.</p>";
                return;
            }
            
            container.innerHTML = productsToShow.map(product => {
                let unitLabel = product.unit;
                return `
                    <div class="product-card">
                        <div class="product-name">${product.name}</div>
                        <div class="weight-custom-container">
                            <input type="number" class="weight-input" id="weight-${product.id}" value="${product.baseWeight}" min="1" oninput="updateCardPrice(${product.id})">
                            <span class="weight-unit-label">${unitLabel}</span>
                        </div>
                        <div class="product-price" id="price-${product.id}">₹${product.basePrice}</div>
                        <button class="add-btn" onclick="addToCart(${product.id})">ADD TO CART</button>
                    </div>
                `;
            }).join('');
        }

        function updateCardPrice(id) {
            const product = products.find(p => p.id === id);
            const inputEl = document.getElementById(`weight-${id}`);
            let currentWeight = parseFloat(inputEl.value) || 0;
            let calculatedPrice = Math.round((currentWeight / product.baseWeight) * product.basePrice);
            const priceEl = document.getElementById(`price-${id}`);
            priceEl.innerText = `₹${calculatedPrice}`;
        }

        function selectCategory(category, element) {
            currentSelectedCategory = category;
            
            // Toggle active classes on tabs
            const tabs = document.querySelectorAll('.category-tab');
            tabs.forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');

            // Update title text
            const titleEl = document.getElementById('section-title');
            titleEl.innerText = element.innerText;

            applyFilters();
        }

        function filterProducts() {
            applyFilters();
        }

        function applyFilters() {
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            
            const filtered = products.filter(product => {
                const matchesCategory = (currentSelectedCategory === 'all' || product.category === currentSelectedCategory);
                const matchesSearch = product.name.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            loadProducts(filtered);
        }

        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { filterProducts(); }
        });

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const inputEl = document.getElementById(`weight-${id}`);
            let chosenWeight = parseFloat(inputEl.value) || product.baseWeight;
            let calculatedPrice = Math.round((chosenWeight / product.baseWeight) * product.basePrice);

            const cartItemKey = `${id}-${chosenWeight}${product.unit}`;
            const exist = cart.find(item => item.cartKey === cartItemKey);

            if (exist) {
                exist.quantity += 1;
            } else {
                cart.push({
                    cartKey: cartItemKey,
                    name: product.name,
                    weight: `${chosenWeight} ${product.unit}`,
                    price: calculatedPrice,
                    quantity: 1
                });
            }
            updateCart();
            
            const cartIcon = document.querySelector('.cart-icon');
            cartIcon.style.transform = "scale(1.1)";
            setTimeout(() => cartIcon.style.transform = "scale(1)", 200);
        }

        function cancelProduct(cartKey) {
            cart = cart.filter(item => item.cartKey !== cartKey);
            updateCart();
        }

        function clearAllCart() {
            cart = [];
            updateCart();
        }

        function updateCart() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartCount = document.getElementById('cart-count');
            const cartTotalAmount = document.getElementById('cart-total-amount');
            const errorBox = document.getElementById('error-box');

            let totalItems = 0;
            let totalPrice = 0;

            cartItemsContainer.innerHTML = cart.map(item => {
                totalItems += item.quantity;
                totalPrice += item.price * item.quantity;
                return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <span>${item.name}</span>
                            <span class="cart-item-qty">${item.weight} x ${item.quantity}</span>
                        </div>
                        <div class="cart-item-right">
                            <span class="cart-item-price">₹${item.price * item.quantity}</span>
                            <button class="remove-item-btn" onclick="cancelProduct('${item.cartKey}')">&times;</button>
                        </div>
                    </div>
                `;
            }).join('');

            cartCount.innerText = totalItems;
            cartTotalAmount.innerText = totalPrice;

            if (totalPrice > 0 && totalPrice < 500) {
                errorBox.style.display = 'block';
            } else {
                errorBox.style.display = 'none';
            }
        }

        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const backdrop = document.getElementById('cart-backdrop');
            sidebar.classList.toggle('active');
            backdrop.classList.toggle('active');
        }

        function sendOrderToWhatsApp() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            let total = 0;
            cart.forEach(item => { total += item.price * item.quantity; });

            if (total < 500) {
                alert("Order cannot be placed! Bill should be above 500rs for home delivery.");
                return;
            }

            const name = document.getElementById('cust-name').value.trim();
            const address = document.getElementById('cust-address').value.trim();

            if (!name || !address) {
                alert("Please fill in your Name and Address for delivery!");
                return;
            }

            let message = `*New Order from Ramaswami Kirana Mart*\n\n`;
            message += `👤 *Customer Name:* ${name}\n`;
            message += `📍 *Delivery Address:* ${address}\n`;
            message += `💵 *Payment Mode:* Cash on Delivery (💵)\n\n`;
            message += `📦 *Items:*\n`;

            cart.forEach((item, index) => {
                message += `${index + 1}. ${item.name} (${item.weight}) - Qty: ${item.quantity} - ₹${item.price * item.quantity}\n`;
            });

            message += `\n💵 *Total Bill:* ₹${total}\n`;
            message += `\n👍 सामान मिलने पर कैश पेमेंट कलेक्ट करें।`;
            message += `\n\nThank you for ordering!`;
            
            const url = `https://api.whatsapp.com/send?phone=${WHATSAPP_NUMBER}&text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        loadProducts();
    </script>
</body>
</html>
