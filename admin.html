<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Ramaswami Kirana</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        .login-box h2 {
            color: #10b981;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #059669;
        }
        #error-msg {
            color: #ef4444;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        #dashboard {
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-box" id="login-screen">
        <h2>Admin Login</h2>
        <input type="email" id="email" placeholder="Admin Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="error-msg"></p>
    </div>

    <div id="dashboard">
        <h2>Welcome to Admin Dashboard</h2>
        <p>You are successfully logged in!</p>
        <button onclick="logout()" style="background: #ef4444; max-width: 200px;">Logout</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDarqM1k5nPFemt7oCYp3l0dz9srkBUOOQ",
            authDomain: "ramaswami-kirana-mart.firebaseapp.com",
            projectId: "ramaswami-kirana-mart",
            storageBucket: "ramaswami-kirana-mart.firebasestorage.app",
            messagingSenderId: "114940627434",
            appId: "1:114940627434:web:08d5d85e827e03d4d24a93"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Make functions globally available to our HTML buttons
        window.auth = auth;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.signOut = signOut;

        // Check if user is logged in or out
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } else {
                document.getElementById('login-screen').style.display = 'block';
                document.getElementById('dashboard').style.display = 'none';
            }
        });
    </script>

    <script>
        function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            window.signInWithEmailAndPassword(window.auth, email, pass)
                .catch((error) => {
                    errorMsg.innerText = "Invalid Email or Password!";
                    errorMsg.style.display = 'block';
                });
        }

        function logout() {
            window.signOut(window.auth);
        }
    </script>

</body>
</html>
