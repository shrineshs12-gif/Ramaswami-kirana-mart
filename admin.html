<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Ramaswami Kirana</title>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .login-box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 350px; margin-top: 10vh; }
        #dashboard { display: none; width: 100%; max-width: 800px; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 20px; }
        .form-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        input, select { flex: 1; min-width: 150px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; }
        button { padding: 12px 20px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-logout { background: #ef4444; padding: 8px 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #f1f5f9; }
        th { background: #f8fafc; color: #475569; }
        #error-msg { color: #ef4444; display: none; margin-top: 15px; font-weight: 600; font-size: 14px; padding: 10px; background: #fee2e2; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="login-box" id="login-screen">
        <h2 style="color: #10b981;">Admin Login</h2>
        <input type="email" id="email" placeholder="Admin Email" style="width: 100%; box-sizing: border-box; margin-bottom: 10px;">
        <input type="password" id="password" placeholder="Password" style="width: 100%; box-sizing: border-box; margin-bottom: 15px;">
        <button onclick="login()" style="width: 100%;">Login</button>
        <p id="error-msg"></p>
    </div>

    <div id="dashboard">
        <div class="header">
            <h2 style="color: #10b981; margin: 0;">Product Manager</h2>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>

        <h3>Add New Product</h3>
        <div class="form-group">
            <input type="text" id="prod-name" placeholder="Product Name (उदा. तांदूळ)">
            <input type="number" id="prod-price" placeholder="Price (₹)">
        </div>
        <div class="form-group">
            <input type="number" id="prod-weight" placeholder="Base Weight (e.g. 1 or 50)">
            <select id="prod-unit">
                <option value="kg">kg</option>
                <option value="g">g</option>
                <option value="Pcs">Pcs</option>
                <option value="Pkt">Pkt</option>
            </select>
            <select id="prod-category">
                <option value="Kirana">Kirana</option>
                <option value="Masala">Masala</option>
                <option value="Suhana">Suhana</option>
                <option value="Oils">Oils</option>
                <option value="Snacks">Snacks</option>
                <option value="HairCare">Hair Care</option>
                <option value="SkinCare">Skin Care</option>
                <option value="Cleaning">Cleaning & Soaps</option>
                <option value="Detergent">Detergent Powders</option>
                <option value="TeaCoffee">Tea & Coffee</option>
                <option value="Biscuits">Biscuits & Cookies</option>
                <option value="Bakery">Bakery</option>
                <option value="Oral">Dental & Oral Care</option>
                <option value="Pooja">Pooja Items</option>
                <option value="Stationary">Stationary</option>
                <option value="Misc">Misc</option>
            </select>
        </div>
        <button onclick="saveProduct()" style="width: 100%; margin-bottom: 30px;">Save Product</button>

        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px;">
            <h3 style="margin: 0;">Database Products</h3>
            <input type="text" id="admin-search" placeholder="Search product name..." onkeyup="filterAdminProducts()" style="max-width: 250px; padding: 8px 12px;">
        </div>

        <div style="overflow-x: auto; max-height: 500px; overflow-y: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Weight/Unit</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="product-list">
                    <tr>
                        <td colspan="4" style="text-align: center; color: #888;">Loading database products... ⏳</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDarqM1k5nPFemt7oCYp3l0dz9srkBUOOQ",
            authDomain: "ramaswami-kirana-mart.firebaseapp.com",
            projectId: "ramaswami-kirana-mart",
            storageBucket: "ramaswami-kirana-mart.firebasestorage.app",
            messagingSenderId: "114940627434",
            appId: "1:114940627434:web:08d5d85e827e03d4d24a93"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.auth = auth;
        window.db = db;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.signOut = signOut;
        window.collection = collection;
        window.addDoc = addDoc;
        window.onSnapshot = onSnapshot;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.updateDoc = updateDoc;

        let allLiveProducts = [];

        window.renderLiveProducts = function(productsArray) {
            const productList = document.getElementById('product-list');
            productList.innerHTML = ""; 

            if (productsArray.length === 0) {
                productList.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #888;">No products found.</td></tr>';
                return;
            }

            productsArray.forEach((data) => {
                const id = data.id;
                productList.innerHTML += `
                    <tr>
                        <td>${data.name}</td>
                        <td>₹${data.price || 0}</td>
                        <td>${data.baseWeight || 1} ${data.unit}</td>
                        <td style="display:flex; gap:5px;">
                            <button style="background: #f59e0b; padding: 5px 10px; font-size: 12px; width: auto; border:none; border-radius:4px; color:white; cursor:pointer;" onclick="editPrice('${id}', ${data.price || 0})">Edit</button>
                            <button style="background: #ef4444; padding: 5px 10px; font-size: 12px; width: auto; border:none; border-radius:4px; color:white; cursor:pointer;" onclick="deleteProduct('${id}')">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        window.filterAdminProducts = function() {
            const query = document.getElementById('admin-search').value.toLowerCase().trim();
            const filtered = allLiveProducts.filter(p => p.name.toLowerCase().includes(query));
            window.renderLiveProducts(filtered);
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';

                onSnapshot(collection(db, "products"), (snapshot) => {
                    allLiveProducts = [];
                    snapshot.forEach((document) => {
                        allLiveProducts.push({ id: document.id, ...document.data() });
                    });
                    window.filterAdminProducts();
                });
            } else {
                document.getElementById('login-screen').style.display = 'block';
                document.getElementById('dashboard').style.display = 'none';
            }
        });
    </script>

    <script>
        function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const errorBox = document.getElementById('error-msg');

            errorBox.style.display = 'none'; 

            window.signInWithEmailAndPassword(window.auth, email, pass).catch((error) => {
                errorBox.innerText = "Login Failed: " + error.message;
                errorBox.style.display = 'block';
            });
        }

        function logout() { 
            window.signOut(window.auth); 
        }

        async function saveProduct() {
            const name = document.getElementById('prod-name').value;
            const price = document.getElementById('prod-price').value;
            const weight = document.getElementById('prod-weight').value;
            const unit = document.getElementById('prod-unit').value;
            const category = document.getElementById('prod-category').value;

            if(!name || !price || !weight) {
                alert("Please fill all details!");
                return;
            }

            try {
                await window.addDoc(window.collection(window.db, "products"), {
                    name: name,
                    price: Number(price),
                    baseWeight: Number(weight),
                    unit: unit,
                    category: category
                });
                alert("New Product Added Successfully!");
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('prod-weight').value = '';
            } catch (e) {
                alert("Error: " + e.message);
            }
        }

        async function editPrice(id, currentPrice) {
            let newPrice = prompt("Enter new price (₹) for this product:", currentPrice);

            if (newPrice !== null && newPrice.trim() !== "") {
                newPrice = Number(newPrice);
                if (!isNaN(newPrice) && newPrice > 0) {
                    try {
                        await window.updateDoc(window.doc(window.db, "products", id), {
                            price: newPrice
                        });
                        alert("Price updated successfully!");
                    } catch (error) {
                        alert("Error updating price: " + error.message);
                    }
                } else {
                    alert("Please enter a valid number!");
                }
            }
        }

        async function deleteProduct(id) {
            if(confirm("Delete this product from Database?")) {
                try {
                    await window.deleteDoc(window.doc(window.db, "products", id));
                    alert("Product deleted successfully!");
                } catch(e) {
                    alert("Error deleting: " + e.message);
                }
            }
        }
    </script>
</body>
</html>
