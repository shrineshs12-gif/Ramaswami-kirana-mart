        // Ensure filter/load works after data updates
        window.loadProductsFromBoth = function(liveProducts) {
            const productList = document.getElementById('product-list');
            productList.innerHTML = ""; 

            // 1. Dikhayen fixed products
            window.hardcodedProducts.forEach(p => {
                productList.innerHTML += `
                    <tr>
                        <td>${p.name}</td>
                        <td>₹${p.basePrice}</td>
                        <td>${p.baseWeight} ${p.unit}</td>
                        <td>
                            <button style="background: #94a3b8; padding: 5px 10px; font-size: 12px; width: auto; border:none; border-radius:4px; color:white; cursor:not-allowed;" onclick="alert('This is a Fixed product. Edit your index.html code to change it.')">Fixed</button>
                        </td>
                    </tr>
                `;
            });

            // 2. Dikhayen naye live products jo Firebase se aaye
            liveProducts.forEach(p => {
                // Check if it's already in fixed list to prevent duplicate showing
                const exists = window.hardcodedProducts.find(old => old.name === p.name);
                if(!exists) {
                    productList.innerHTML += `
                        <tr>
                            <td>${p.name}</td>
                            <td>₹${p.price}</td>
                            <td>${p.baseWeight || p.weight} ${p.unit}</td>
                            <td>
                                <button style="background: #ef4444; padding: 5px 10px; font-size: 12px; width: auto; border:none; border-radius:4px; color:white; cursor:pointer;" onclick="deleteProduct('${p.id}')">Delete</button>
                            </td>
                        </tr>
                    `;
                }
            });
        };

        function loadProducts() {
            onSnapshot(collection(db, "products"), (snapshot) => {
                let liveItems = [];
                snapshot.forEach((document) => {
                    liveItems.push({ id: document.id, ...document.data() });
                });
                // Call the render function with new data
                window.loadProductsFromBoth(liveItems);
            });
        }
    </script>

    <script>
        function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            window.signInWithEmailAndPassword(window.auth, email, pass).catch(() => {
                document.getElementById('error-msg').innerText = "Invalid Email or Password!";
                document.getElementById('error-msg').style.display = 'block';
            });
        }
        
        function logout() { 
            window.signOut(window.auth); 
        }

        async function saveProduct() {
            const name = document.getElementById('prod-name').value;
            const price = document.getElementById('prod-price').value;
            const weight = document.getElementById('prod-weight').value;
            const unit = document.getElementById('prod-unit').value;
            const category = document.getElementById('prod-category').value;

            if(!name || !price || !weight) {
                alert("Please fill all details!");
                return;
            }

            try {
                await window.addDoc(window.collection(window.db, "products"), {
                    name: name,
                    price: Number(price),
                    baseWeight: Number(weight),
                    unit: unit,
                    category: category
                });
                alert("New Product Added Successfully to Live Database!");
                
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('prod-weight').value = '';
            } catch (e) {
                alert("Error: " + e.message);
            }
        }

        async function deleteProduct(id) {
            if(confirm("Delete this product from Live Database?")) {
                await window.deleteDoc(window.doc(window.db, "products", id));
            }
        }
    </script>
